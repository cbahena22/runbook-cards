title: Ntdsutil snapshot or media creation
id: 97c55146-6832-52d6-ac91-e030aa1ec797
name: chm-win-016
status: test
description: ntdsutil.exe used to create install media, which copies the directory
  database.
author: Calder Health MSSP detection team (fictional)
date: '2026-10-01'
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: \ntdsutil.exe
    CommandLine|contains:
    - ifm
    - create full
  condition: selection
falsepositives:
- Planned domain controller builds
level: critical
tags:
- attack.credential_access
- attack.t1003.003
