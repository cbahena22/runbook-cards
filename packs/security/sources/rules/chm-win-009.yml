title: Registry hive saved to a file
id: 5cfac948-574f-5f93-800a-7041b6d04111
name: chm-win-009
status: test
description: reg.exe saving the SAM or SYSTEM hive.
author: Calder Health MSSP detection team (fictional)
date: '2026-10-01'
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: \reg.exe
    CommandLine|contains:
    - ' save HKLM\SAM'
    - ' save HKLM\SYSTEM'
  condition: selection
falsepositives:
- None known
level: high
tags:
- attack.credential_access
- attack.t1003.002
