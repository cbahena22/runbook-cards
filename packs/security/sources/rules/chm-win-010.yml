title: Local account added from the command line
id: cf9fcd46-c463-5b8d-9120-591040d9e835
name: chm-win-010
status: test
description: net.exe or net1.exe adding a local user.
author: Calder Health MSSP detection team (fictional)
date: '2026-10-01'
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
    - \net.exe
    - \net1.exe
    CommandLine|contains|all:
    - user
    - /add
  condition: selection
falsepositives:
- Helpdesk scripts for lab machines
level: medium
tags:
- attack.persistence
- attack.t1136.001
