title: Certutil used to fetch a file
id: 9f844ced-c124-5814-ae27-aa307c9bcd4e
name: chm-win-003
status: test
description: certutil.exe with urlcache or verifyctl arguments, a known download trick.
author: Calder Health MSSP detection team (fictional)
